name: Validate and deploy portfolio

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Normal deployment or one-time launcher setup"
        required: true
        type: choice
        default: deploy
        options: [deploy, stage, verify-bootstrap]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:e2e
      - name: Production build and standalone browser smoke test
        run: npm run test:standalone
      - name: TypeScript
        run: npm run typecheck

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
      CPANEL_RELEASES_READY: ${{ vars.CPANEL_RELEASES_READY }}
      RELEASE_MODE: ${{ inputs.release_mode || 'deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; this older build will not be deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check release configuration
        if: steps.current.outputs.deploy == 'true'
        run: |
          node --input-type=module -e 'import { deploymentConfig } from "./scripts/deploy/release.mjs"; deploymentConfig(); if (process.env.RELEASE_MODE === "deploy" && process.env.CPANEL_RELEASES_READY !== "true") throw new Error("Complete the one-time launcher setup in README before enabling automatic deployment.");'
      - name: Install production build dependencies
        if: steps.current.outputs.deploy == 'true'
        run: npm ci
      - name: Verify database prerequisites without authenticated writes
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/deploy/preflight.mjs
      - name: Build exact release
        if: steps.current.outputs.deploy == 'true'
        run: npm run build
      - name: Prepare portable release
        if: steps.current.outputs.deploy == 'true'
        run: npm run release:prepare -- "$GITHUB_SHA"
      - name: Retain release artifact
        if: steps.current.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          retention-days: 14
      - name: Configure verified SSH connection
        if: steps.current.outputs.deploy == 'true'
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_SSH_KEY" || (echo "Missing CPANEL_SSH_KEY" && exit 1)
          test -n "$CPANEL_KNOWN_HOSTS" || (echo "Missing verified CPANEL_KNOWN_HOSTS" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/portfolio_key
          chmod 600 ~/.ssh/portfolio_key
          ssh-keygen -y -P "${CPANEL_SSH_PASSPHRASE:-}" -f ~/.ssh/portfolio_key > /dev/null
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\n" "${CPANEL_SSH_PASSPHRASE:-}"' > ~/.ssh/portfolio_askpass
          chmod 700 ~/.ssh/portfolio_askpass
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/portfolio_askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/portfolio_key < /dev/null
          rm -f ~/.ssh/portfolio_key ~/.ssh/portfolio_askpass
      - name: Read-only hosting capability check
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/deploy/release.mjs probe "$GITHUB_SHA"
      - name: Stage, activate and verify release
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/deploy/release.mjs "$RELEASE_MODE" "$GITHUB_SHA"
      - name: Clear SSH agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k
